name: Installation and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      TELEGRAM_BOT_TOKEN: "123456:offline-test"
      ALLOWED_USER_IDS: "42"
      ENABLE_MEMORY: "false"
      LLM_BACKEND: local
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python validate.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: whatsapp-bridge
        run: npm ci
      - working-directory: whatsapp-bridge
        run: npm test
